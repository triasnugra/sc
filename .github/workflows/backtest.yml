name: backtest
on: workflow_dispatch
permissions: {contents: write}
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/backtest.mjs
      - run: |
          git config user.name "scalp-bot"; git config user.email "scalp-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "backtest" && git pull --rebase && git push)

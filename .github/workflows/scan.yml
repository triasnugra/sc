name: scan
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scan, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/test-core.mjs
      - run: node scripts/scan.mjs
      - run: |
          git config user.name "scalp-bot"; git config user.email "scalp-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "scan $(date -u +%FT%TZ)" && git pull --rebase && git push)
